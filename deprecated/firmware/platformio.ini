; gliim — ATtiny814 joystick LED dimmer
;
; Build & upload with a serialUPDI programmer (a USB-serial adapter with a
; resistor from TX to the UPDI pin — see docs/hardware.md).
;
;   pio run                         # compile
;   pio run -t upload               # flash via serialUPDI
;   pio run -t fuses -e set_fuses   # set clock/BOD/EESAVE fuses (do once)
;   pio device monitor              # serial console (only if GLIIM_DEBUG=1)
;
; Adjust upload_port to match your adapter (ls /dev/cu.* on macOS).

[platformio]
default_envs = ATtiny814

[env]
platform      = atmelmegaavr
framework     = arduino
board         = ATtiny814

; 20 MHz off the internal oscillator — no external crystal needed. In spec at
; 5 V: datasheet Table 34-3 allows 20 MHz for VDD 4.5–5.5 V up to 105 °C.
; Changing this needs a re-fuse (OSCCFG), not just a reflash:
;   utils/flash.sh --fuses
board_build.f_cpu     = 20000000L
board_hardware.oscillator = internal

; Keep saved brightness across reprogramming.
board_hardware.eesave = yes

; Brown-out detect. megatinycore accepts ONLY 4.3v / 2.6v / 1.8v — any other
; value (e.g. dxcore's 2.7v) silently falls through to "disabled". Worth having:
; gliim writes EEPROM and lives on a wall switch, so it gets power-cut often.
; 2.6v is conservative and can't false-trigger on rail ripple; 4.3v would match
; the 4.5 V that 20 MHz operation actually requires, at the risk of resetting on
; a sagging rail. Takes effect only on `utils/flash.sh --fuses`.
board_hardware.bod    = 2.6v

monitor_speed = 115200

; upload_port is deliberately not pinned here — utils/flash.sh auto-detects the
; adapter and passes it in. Uncomment to force a specific one.
[env:ATtiny814]
upload_protocol = serialupdi
upload_speed    = 230400
; upload_port   = /dev/cu.usbserial-1440

; Run once to write the fuses (clock source, BOD, EESAVE). Same wiring as upload.
; updipin stays 'updi' — never set this to gpio/reset, it would lock you out.
[env:set_fuses]
upload_protocol        = serialupdi
upload_speed           = 230400
board_hardware.updipin = updi
; upload_port          = /dev/cu.usbserial-1440

; ── rev2: ATtiny3216, 20-pin ───────────────────────────────────────────────
; Same source; -DGLIIM_BOARD=2 selects the rev2 pin map in config.h — LEDs on
; PB3/PB4/PB5 (TCA0 alternates), I²C on PB0/PB1, UART on PB2, IR on PC0,
; status LED on PC1.
;   utils/flash.sh --rev2            build + upload
;   utils/flash.sh --rev2 --fuses    fuses for a fresh 3216
; rev2 runs at 5 V like rev1, so it inherits the 20 MHz f_cpu from [env]. The
; Qwiic port is bridged by a 3.3 V LDO + BSS138 translator instead (see
; hardware/rev2/README.md §5), with the LDO's enable under MCU control on PC2.
[env:rev2]
board              = ATtiny3216
build_flags        = -DGLIIM_BOARD=2
upload_protocol    = serialupdi
upload_speed       = 230400

[env:rev2_fuses]
board                  = ATtiny3216
build_flags            = -DGLIIM_BOARD=2
upload_protocol        = serialupdi
upload_speed           = 230400
board_hardware.updipin = updi
